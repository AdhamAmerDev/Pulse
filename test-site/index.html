<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse test site</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #2b2622; background: #faf6f1; }
      body { max-width: 680px; margin: 0 auto; padding: 48px 20px; }
      h1 { font-size: 28px; font-weight: 500; }
      p { color: #6f665f; line-height: 1.6; }
      form { display: grid; gap: 12px; max-width: 480px; margin-top: 28px; }
      label { font-size: 12px; color: #8a8078; }
      input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #e8dcd3; border-radius: 8px; background: #fffaf5; color: #2b2622; }
      button { width: fit-content; padding: 10px 14px; border: 0; border-radius: 8px; background: #e4572e; color: #faf6f1; cursor: pointer; }
      code { font-size: 12px; }
      #status { margin-top: 24px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Pulse test site</h1>
    <p>Enter the address of a running Pulse server and the credentials for one of its sites. This page then sends a page-view event from GitHub Pages.</p>

    <form id="pulse-form">
      <label>Pulse server URL <input id="pulse-url" required placeholder="https://pulse.example.com" /></label>
      <label>Site ID <input id="site-id" required placeholder="your-site-id" /></label>
      <label>Ingest key <input id="ingest-key" required placeholder="your-ingest-key" /></label>
      <button type="submit">Start tracking</button>
    </form>
    <p id="status">No tracker loaded yet.</p>

    <script>
      const params = new URLSearchParams(window.location.search);
      const fields = {
        pulseUrl: document.querySelector("#pulse-url"),
        siteId: document.querySelector("#site-id"),
        ingestKey: document.querySelector("#ingest-key"),
      };

      fields.pulseUrl.value = params.get("pulse") || localStorage.getItem("pulse-test-url") || "";
      fields.siteId.value = params.get("site") || localStorage.getItem("pulse-test-site") || "";
      fields.ingestKey.value = params.get("key") || localStorage.getItem("pulse-test-key") || "";

      document.querySelector("#pulse-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const pulseUrl = fields.pulseUrl.value.replace(/\/$/, "");
        localStorage.setItem("pulse-test-url", pulseUrl);
        localStorage.setItem("pulse-test-site", fields.siteId.value);
        localStorage.setItem("pulse-test-key", fields.ingestKey.value);

        const script = document.createElement("script");
        script.src = `${pulseUrl}/pulse.js`;
        script.dataset.site = fields.siteId.value;
        script.dataset.key = fields.ingestKey.value;
        script.onload = () => { document.querySelector("#status").textContent = "Tracker loaded. Open the Pulse dashboard to check for this visit."; };
        script.onerror = () => { document.querySelector("#status").textContent = "Could not load pulse.js. Check the server URL and HTTPS setup."; };
        document.head.appendChild(script);
        document.querySelector("#status").textContent = "Loading tracker...";
      });
    </script>
  </body>
</html>
